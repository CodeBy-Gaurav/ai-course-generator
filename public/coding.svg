<svg
  width="520"
  height="360"
  viewBox="0 0 520 360"
  xmlns="http://www.w3.org/2000/svg"
  role="img"
  aria-label="Code editor illustration"
>

  <!-- Background Card -->
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#C8F7B2"/>
      <stop offset="100%" stop-color="#39C6A5"/>
    </linearGradient>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect
    x="20"
    y="20"
    rx="28"
    ry="28"
    width="480"
    height="320"
    fill="url(#bgGrad)"
    filter="url(#softShadow)"
  />

  <!-- Browser Top Bar -->
  <rect x="20" y="20" rx="28" ry="28" width="480" height="70" fill="#F6EFEA"/>
  <rect x="20" y="60" width="480" height="30" fill="#F6EFEA"/>

  <!-- Browser Dots -->
  <circle cx="70" cy="55" r="10" fill="#FF5F57"/>
  <circle cx="105" cy="55" r="10" fill="#FFBD2E"/>
  <circle cx="140" cy="55" r="10" fill="#28C840"/>

  <!-- Code Lines (Left) -->
  <rect x="60" y="120" width="80" height="14" rx="7" fill="#6FBF9E"/>
  <rect x="60" y="150" width="120" height="14" rx="7" fill="#6FBF9E"/>
  <rect x="60" y="180" width="90" height="14" rx="7" fill="#6FBF9E"/>
  <rect x="60" y="230" width="110" height="14" rx="7" fill="#6FBF9E"/>

  <!-- Code Symbol </> -->
  <g
    stroke="#FFFFFF"
    stroke-width="18"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
  >
    <!-- < -->
    <path d="M240 150 L200 200 L240 250"/>
    <!-- / -->
    <path d="M270 140 L310 260"/>
    <!-- > -->
    <path d="M340 150 L380 200 L340 250"/>
  </g>

</svg>
